# ---------------------------------------------------------------------------
# 02 - Nginx Basics: an annotated tour of a full nginx.conf
# ---------------------------------------------------------------------------
# Unlike the other files in this repo (which are single server blocks meant to
# be dropped into sites-available/ or conf.d/), this file is a COMPLETE
# nginx.conf so you can see every context in one place:
#
#   main context  ->  events {}  ->  http {}  ->  server {}  ->  location {}
#
# Run it without touching your system config:
#   nginx -p $(pwd) -c 02-nginx-basics/basic-confg.conf -t
# ---------------------------------------------------------------------------

# ===== MAIN CONTEXT ========================================================
# Directives out here are global: they configure the Nginx process itself.

user  www-data;                 # OS user the worker processes run as
worker_processes  auto;         # "auto" = one worker per CPU core
pid  /run/nginx.pid;
error_log  /var/log/nginx/error.log warn;   # debug|info|notice|warn|error|crit

# ===== EVENTS CONTEXT ======================================================
# How workers accept connections. This is where Nginx's famous concurrency
# is tuned.
events {
    worker_connections  1024;   # max simultaneous connections PER worker
    multi_accept        on;     # accept as many new connections as possible
}

# ===== HTTP CONTEXT ========================================================
# Everything about serving HTTP. Settings here are inherited by every
# server block below, unless a server block overrides them.
http {
    # --- MIME types --------------------------------------------------------
    include       mime.types;               # maps .css -> text/css, etc.
    default_type  application/octet-stream; # fallback for unknown extensions

    # --- Logging -----------------------------------------------------------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    # --- Performance basics ------------------------------------------------
    sendfile        on;         # copy files kernel-side, skipping user space
    tcp_nopush      on;         # send headers in one packet (pairs w/ sendfile)
    tcp_nodelay     on;         # don't buffer small responses on keep-alive
    keepalive_timeout  65;      # seconds to hold an idle connection open
    types_hash_max_size 2048;
    server_tokens   off;        # hide the Nginx version in errors/headers

    # --- Compression -------------------------------------------------------
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml image/svg+xml;

    # --- SERVER CONTEXT ----------------------------------------------------
    # One server block = one virtual host. Nginx picks a block by matching
    # the request's port (listen) and Host header (server_name).
    server {
        listen 80 default_server;   # default_server = used when nothing matches
        server_name localhost;

        root  /var/www/html;
        index index.html;

        # --- LOCATION CONTEXT ---------------------------------------------
        # Matching order: exact (=), then ^~ prefix, then regex (~ / ~*),
        # then the longest plain prefix.

        location / {                        # prefix match, the catch-all
            try_files $uri $uri/ =404;
        }

        location = /health {                # "=" is an exact match, fastest
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location ^~ /assets/ {              # "^~" wins over regex matches
            expires 30d;                    # tell browsers to cache
            add_header Cache-Control "public, immutable";
        }

        location ~* \.(jpg|jpeg|png|gif|webp)$ {   # "~*" = case-insensitive regex
            expires 7d;
            access_log off;
        }

        # Friendly error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html { internal; }
    }

    # A second virtual host on the SAME port, told apart by server_name.
    server {
        listen 80;
        server_name blog.localhost;
        root /var/www/blog;
        index index.html;
    }
}
