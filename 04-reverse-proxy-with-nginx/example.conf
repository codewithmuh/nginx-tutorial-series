# ---------------------------------------------------------------------------
# 04 - Reverse Proxy with Nginx
# ---------------------------------------------------------------------------
# Nginx sits in front of your app (Node, Django, Flask, Rails, Spring...) and
# forwards requests to it. The app listens on 127.0.0.1 and is never exposed
# to the internet directly.
#
#   Browser  ->  Nginx :80  ->  app :3000
# ---------------------------------------------------------------------------

# An upstream names your backend. Even with one server it's worth using:
# it enables keepalive and gives you one place to change the address.
upstream app_backend {
    server 127.0.0.1:3000;

    # Reuse connections to the backend instead of opening a new TCP
    # connection per request. Requires the two proxy_ directives below.
    keepalive 32;
}

server {
    listen 80;
    server_name localhost app.example.com;

    # Don't let a huge upload sail through to your app unchecked.
    client_max_body_size 10m;

    location / {
        proxy_pass http://app_backend;

        # --- Pass the real client details through -------------------------
        # Without these your app sees every request as coming from 127.0.0.1
        # over http, which breaks logging, rate limiting and redirect URLs.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # --- Required for upstream keepalive to actually work -------------
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # --- Timeouts ------------------------------------------------------
        proxy_connect_timeout 5s;    # give up if the app won't accept
        proxy_send_timeout   60s;
        proxy_read_timeout   60s;    # raise this for slow endpoints/reports

        # --- Retry the next upstream on failure ---------------------------
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # --- WebSockets --------------------------------------------------------
    # Socket.IO, Rails ActionCable, Django Channels, Next.js HMR... all need
    # the Upgrade handshake forwarded verbatim.
    location /ws/ {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 7d;       # long-lived connections shouldn't time out
    }

    # --- Let Nginx serve static files, not your app ------------------------
    # Node/Python are slow at this and Nginx is superb at it.
    location /static/ {
        alias /var/www/app/static/;   # note: alias, not root (see chapter 07)
        expires 30d;
        access_log off;
    }

    # --- Server-Sent Events / streaming responses --------------------------
    location /events {
        proxy_pass http://app_backend;
        proxy_buffering off;          # flush chunks straight to the client
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # --- Health check that never touches the app ---------------------------
    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
