# Runnable version of Project 1 (chapter 13): Nginx serving a static site,
# with /api/ proxied to a small backend container.
#
#   docker compose up
#   curl http://localhost:8080/
#   curl http://localhost:8080/api/hello
#
# Nothing is installed on your machine, and nothing needs sudo.

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      # The static site from chapter 03
      - ../03-hosting-static-websites/website-files:/var/www/example.com:ro
      # The config below - edit it, then: docker compose restart nginx
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  api:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./api:/app:ro
    command: node server.js
