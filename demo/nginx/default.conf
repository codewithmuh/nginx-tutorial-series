# Demo config for `docker compose up`. Edit freely - it only affects the
# container. Reload with: docker compose restart nginx

upstream demo_api {
    server api:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;

    root  /var/www/example.com;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 256;

    # --- The API, proxied ---------------------------------------------------
    location /api/ {
        proxy_pass http://demo_api;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
    }

    # --- Static assets, cached ---------------------------------------------
    # One combined Cache-Control instead of `expires 30d;` PLUS an add_header:
    # using both emits the header twice. Clients cope, but a single explicit
    # header is what you want to ship.
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Request-ID  $request_id always;   # see the note below
    }

    # --- HTML, never cached -------------------------------------------------
    location ~* \.html$ {
        add_header Cache-Control "no-cache";

        # THE add_header TRAP: a location with its own add_header discards
        # EVERY header inherited from the server block. Without this line,
        # the X-Request-ID set at server level silently vanishes on every
        # HTML response. Try commenting it out and running:
        #     curl -sI localhost:8080/ | grep -i x-request-id
        add_header X-Request-ID $request_id always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location ~ /\.(?!well-known) { deny all; }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    server_tokens off;
    add_header X-Request-ID $request_id always;
}
