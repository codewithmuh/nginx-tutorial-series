# ---------------------------------------------------------------------------
# 09 - Optimizing Nginx for Performance
# ---------------------------------------------------------------------------
# Measure first, then change ONE thing at a time and measure again. Copying a
# "10x faster nginx.conf" from a blog is how you end up with a slower server
# and no idea why.
#
# The main-context and events-context directives below belong in nginx.conf.
# Everything from "http {" onward can live in your site config.
# ---------------------------------------------------------------------------

# ===== MAIN CONTEXT (nginx.conf) ===========================================
#
#   worker_processes  auto;          # one worker per CPU core
#   worker_rlimit_nofile 65535;      # raise the file-descriptor ceiling
#
#   events {
#       worker_connections 4096;     # per worker; max clients = workers x this
#       multi_accept       on;
#       use                epoll;    # Linux; kqueue on BSD/macOS
#   }
#
# ===========================================================================

# --- Static file delivery ---------------------------------------------------
sendfile        on;      # kernel copies the file straight to the socket
tcp_nopush      on;      # fill packets before sending (pairs with sendfile)
tcp_nodelay     on;      # but don't delay small keep-alive responses
sendfile_max_chunk 2m;   # stop one big file from hogging a worker

# --- Connection reuse -------------------------------------------------------
keepalive_timeout  65;    # hold idle client connections open (saves handshakes)
keepalive_requests 1000;  # requests per connection before recycling
reset_timedout_connection on;

# --- Compression ------------------------------------------------------------
gzip              on;
gzip_vary         on;     # tell caches the response varies on Accept-Encoding
gzip_comp_level   5;      # 5 is the sweet spot; 9 costs CPU for ~2% more
gzip_min_length   1024;   # compressing tiny files makes them bigger
gzip_proxied      any;
gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml
    application/rss+xml image/svg+xml font/woff2;
# Note: text/html is ALWAYS compressed - listing it is a no-op.
# Don't list jpg/png/webp/mp4/woff2-in-container: already compressed.

# Brotli compresses 15-20% better than gzip but needs the ngx_brotli module:
#   brotli            on;
#   brotli_comp_level 5;
#   brotli_types      text/css application/javascript application/json;

# --- Static file caching in Nginx itself ------------------------------------
# Caches open file descriptors and stat() results, not contents. Huge win for
# sites with many small files.
open_file_cache          max=10000 inactive=30s;
open_file_cache_valid    60s;
open_file_cache_min_uses 2;
open_file_cache_errors   on;

# --- Buffers ----------------------------------------------------------------
# Too small -> Nginx writes temp files to disk on every request.
# Check the error log for "a client request body is buffered to a temporary file".
client_body_buffer_size    16k;
client_header_buffer_size  1k;
large_client_header_buffers 4 8k;
output_buffers             2 32k;

# --- Proxy cache ------------------------------------------------------------
# The single biggest win available: stop asking the backend the same question.
proxy_cache_path /var/cache/nginx/proxy
                 levels=1:2
                 keys_zone=app_cache:10m    # 10m of keys ~= 80,000 entries
                 max_size=2g
                 inactive=60m
                 use_temp_path=off;         # write straight into the cache

upstream app_backend {
    server 127.0.0.1:3000;
    keepalive 64;              # reuse backend connections - always do this
}

server {
    listen 80;
    server_name example.com;

    root  /var/www/example.com;
    index index.html;

    # --- Browser caching ---------------------------------------------------
    # Fingerprinted assets (app.a1b2c3.js) can be cached forever.
    location ~* \.(css|js|woff2|jpg|jpeg|png|gif|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        open_file_cache max=3000 inactive=120s;
    }

    # HTML must not be cached, or deploys don't reach anyone.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # --- Cached proxying ---------------------------------------------------
    location /api/ {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_cache        app_cache;
        proxy_cache_key    "$scheme$request_method$host$request_uri";
        proxy_cache_valid  200 301 302 10m;
        proxy_cache_valid  404 1m;

        # Serve stale content while refreshing, and when the backend is sick.
        # This is what keeps your site up during a backend incident.
        proxy_cache_use_stale error timeout updating
                              http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        # Collapse a thundering herd into ONE backend request.
        proxy_cache_lock         on;
        proxy_cache_lock_timeout 5s;

        # Never cache a logged-in user's page.
        proxy_cache_bypass $http_authorization $cookie_sessionid;
        proxy_no_cache     $http_authorization $cookie_sessionid;

        add_header X-Cache-Status $upstream_cache_status always;
    }

    # --- Big downloads -----------------------------------------------------
    location /downloads/ {
        alias /var/www/files/;
        # Cap per-connection speed after the first 10MB so one downloader
        # can't saturate the link.
        limit_rate_after 10m;
        limit_rate       2m;
        aio threads;                 # offload disk reads to a thread pool
        directio 8m;                 # bypass the page cache for large files
        output_buffers 2 1m;
    }
}
