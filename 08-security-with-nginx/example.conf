# ---------------------------------------------------------------------------
# 08 - Security with Nginx
# ---------------------------------------------------------------------------
# Hardening a public server block: security headers, rate limiting, request
# size limits, hidden-file blocking, IP rules and basic auth.
#
# Nginx is not a WAF, but these settings stop a large share of the noise that
# hits every server on the internet.
# ---------------------------------------------------------------------------

# --- Rate limit zones (http context) ---------------------------------------
# $binary_remote_addr is the client IP in packed form (4 bytes vs ~15).
# A 10m zone tracks roughly 160,000 addresses.
limit_req_zone  $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=login:10m   rate=5r/m;
limit_req_zone  $binary_remote_addr zone=api:10m     rate=10r/s;

# Cap concurrent connections per IP (slow-loris / scraper defence).
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Return 429 instead of the default 503 - it's the correct status and
# well-behaved clients back off on it.
limit_req_status  429;
limit_conn_status 429;

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root  /var/www/example.com;
    index index.html;

    # --- Don't advertise what you're running -------------------------------
    server_tokens off;              # "nginx" instead of "nginx/1.27.5"

    # --- Security headers --------------------------------------------------
    # "always" makes them apply to error responses too (404, 500...).
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;   # clickjacking
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    # Content-Security-Policy is the strongest defence against XSS - and the
    # easiest to get wrong. Start in report-only mode, read the reports,
    # tighten, then switch to the enforcing header.
    add_header Content-Security-Policy-Report-Only
        "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'self'" always;

    # --- Request size and timeout limits -----------------------------------
    client_max_body_size     10m;   # 413 above this
    client_body_buffer_size  128k;
    client_header_timeout    10s;   # slow-loris: don't wait forever for headers
    client_body_timeout      10s;
    send_timeout             10s;
    large_client_header_buffers 4 8k;

    # --- Only allow the methods you actually use ---------------------------
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # --- Block hidden files: .git, .env, .htpasswd, backups ----------------
    # (?!well-known) keeps ACME challenges reachable for cert renewal.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(bak|old|orig|save|swp|sql|log|ini|conf)$ {
        deny all;
    }

    # --- Global rate limit -------------------------------------------------
    location / {
        # burst=20 allows short spikes; nodelay serves the burst immediately
        # instead of queuing it. Without burst, normal browsing hits 429.
        limit_req  zone=general burst=20 nodelay;
        limit_conn addr 20;

        try_files $uri $uri/ =404;
    }

    # --- Strict limit on the login endpoint --------------------------------
    # 5 requests/minute per IP makes credential stuffing impractical.
    location = /login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- IP allow-listing for admin areas ----------------------------------
    location /admin/ {
        allow 203.0.113.0/24;      # office range
        allow 10.0.0.0/8;          # VPN
        deny  all;                 # everyone else: 403

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # --- HTTP basic auth ---------------------------------------------------
    # Create the file with:
    #   sudo htpasswd -c /etc/nginx/.htpasswd alice
    # Basic auth is a speed bump, not a security model - always pair it
    # with HTTPS so the credentials aren't sent in the clear.
    location /internal/ {
        auth_basic           "Restricted area";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # --- Don't proxy requests for unknown hosts ----------------------------
    # A default_server that returns 444 (close connection, no response) makes
    # bots scanning by IP address go away.
    #
    #   server {
    #       listen 80 default_server;
    #       listen 443 ssl default_server;
    #       server_name _;
    #       return 444;
    #   }

    access_log /var/log/nginx/secure.access.log;
    error_log  /var/log/nginx/secure.error.log warn;
}
