# ---------------------------------------------------------------------------
# 11 - Debugging and Monitoring
# ---------------------------------------------------------------------------
# Logs you can actually query, a status endpoint, health checks, and the
# switches to flip when something is broken at 2am.
# ---------------------------------------------------------------------------

# --- Log formats (http context) --------------------------------------------

# Combined + timings + cache status + upstream. This is the format worth
# running in production: it answers "which request was slow, and why".
log_format detailed
    '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'rt=$request_time uct=$upstream_connect_time '
    'uht=$upstream_header_time urt=$upstream_response_time '
    'cache=$upstream_cache_status upstream=$upstream_addr';

# JSON - if you ship logs to Loki, Elasticsearch, Datadog or CloudWatch,
# structured beats regex parsing every time.
log_format json escape=json
    '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_addr":"$upstream_addr",'
    '"cache_status":"$upstream_cache_status",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"x_forwarded_for":"$http_x_forwarded_for",'
    '"request_id":"$request_id"'
    '}';

# Only log requests that were slow or failed. Keeps a "problems only" log
# next to the full one.
map $status $is_error {
    ~^[45]  1;
    default 0;
}
map $request_time $is_slow {
    default 0;
    ~^[1-9] 1;          # >= 1 second
}
map "$is_error$is_slow" $log_problem {
    "00"    0;
    default 1;
}

server {
    listen 80;
    server_name example.com;

    root /var/www/example.com;

    # --- Access logs -------------------------------------------------------
    access_log /var/log/nginx/access.log detailed;
    access_log /var/log/nginx/access.json.log json;
    access_log /var/log/nginx/problems.log detailed if=$log_problem;

    # --- Error log ---------------------------------------------------------
    # Levels: debug info notice warn error crit alert emerg
    # Production: warn. Debugging: info (or debug, if built with --with-debug).
    error_log /var/log/nginx/error.log warn;

    # --- Request ID --------------------------------------------------------
    # $request_id is a unique hex string per request. Pass it to your backend
    # and return it to the client, and you can trace one request across
    # Nginx, your app logs and a user's bug report.
    add_header X-Request-ID $request_id always;

    location / {
        try_files $uri $uri/ @app;
    }

    location @app {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Request-ID    $request_id;   # <- trace it through
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Nginx's own metrics ----------------------------------------------
    # Requires --with-http_stub_status_module (in every mainstream package).
    # Output:
    #   Active connections: 43
    #   server accepts handled requests
    #    10231 10231 42891
    #   Reading: 0 Writing: 5 Waiting: 38
    location = /nginx_status {
        stub_status;

        allow 127.0.0.1;        # Prometheus exporter, monitoring agent
        allow 10.0.0.0/8;
        deny  all;              # never expose this publicly

        access_log off;
    }

    # --- Health endpoints --------------------------------------------------
    # Shallow: is Nginx itself alive? Never touches the backend.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Deep: is the whole stack alive? Used by load balancer health checks.
    location = /readyz {
        access_log off;
        proxy_pass http://127.0.0.1:3000/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout    2s;
    }

    # --- Debugging a single client ----------------------------------------
    # With a --with-debug build you can turn on debug logging for ONE IP
    # instead of drowning the disk. These go in the events/main context:
    #
    #   error_log /var/log/nginx/error.log;
    #   events {
    #       debug_connection 203.0.113.42;
    #   }
}
