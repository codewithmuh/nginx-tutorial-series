# ---------------------------------------------------------------------------
# 10 - Nginx as a Media Server
# ---------------------------------------------------------------------------
# Serving images, audio and video properly: range requests for seeking,
# HLS streaming, signed URLs, bandwidth caps and CORS for browser players.
# ---------------------------------------------------------------------------

# Streaming MIME types. Modern nginx ships most of these in mime.types
# already; older distributions do not, and a wrong Content-Type means the
# player simply refuses to play. Types declared here are ADDED to the
# defaults - re-declaring one only produces a harmless "duplicate extension"
# warning at startup.
types {
    application/vnd.apple.mpegurl  m3u8;    # HLS playlist
    video/mp2t                     ts;      # HLS segment
    application/dash+xml           mpd;     # MPEG-DASH manifest
}

server {
    listen 80;
    server_name media.example.com;

    root /var/www/media;

    # Media files are large; buffering them in memory helps nobody.
    sendfile       on;
    tcp_nopush     on;
    aio            threads;      # async disk reads via a thread pool
    directio       8m;           # skip the page cache for files over 8MB
    output_buffers 2 1m;

    # Don't gzip media - it's already compressed.
    gzip off;

    # =======================================================================
    # Progressive download with seeking (plain .mp4 / .mp3)
    # =======================================================================
    # Byte-range support is what makes the scrub bar work. It's on by default
    # in Nginx; the mp4 module additionally allows ?start=120 seeking.
    location /videos/ {
        mp4;                         # requires --with-http_mp4_module
        mp4_buffer_size       1m;
        mp4_max_buffer_size   10m;

        # Let the first few seconds download at full speed so playback starts
        # instantly, then throttle to roughly the bitrate of the stream.
        limit_rate_after 5m;
        limit_rate       1m;         # ~8 Mbps

        add_header Accept-Ranges bytes;
    }

    location /audio/ {
        limit_rate_after 2m;
        limit_rate       200k;
        add_header Accept-Ranges bytes;
    }

    # =======================================================================
    # HLS - adaptive bitrate streaming
    # =======================================================================
    # Produce the files with ffmpeg, then just serve them as static assets:
    #
    #   ffmpeg -i source.mp4 \
    #     -c:v h264 -c:a aac \
    #     -hls_time 6 -hls_playlist_type vod \
    #     -hls_segment_filename '/var/www/media/hls/seg_%03d.ts' \
    #     /var/www/media/hls/index.m3u8
    location /hls/ {
        # The playlist changes for live streams - never cache it.
        location ~ \.m3u8$ {
            add_header Cache-Control "no-cache, no-store";
            add_header Access-Control-Allow-Origin "*";
        }

        # Segments are immutable once written - cache them hard.
        location ~ \.ts$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
        }
    }

    # =======================================================================
    # CORS for browser players
    # =======================================================================
    # video.js, hls.js and friends fetch segments via XHR/fetch, so the
    # media host must allow the page's origin.
    location /public/ {
        add_header Access-Control-Allow-Origin  "https://example.com" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

        # Answer the preflight cheaply.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            return 204;
        }
    }

    # =======================================================================
    # Signed URLs - paid or private content
    # =======================================================================
    # Requires --with-http_secure_link_module. The URL looks like:
    #   /secure/movie.mp4?md5=<hash>&expires=<unix-ts>
    # Your app generates the hash with the same secret; the link stops
    # working when it expires, so it can't be shared indefinitely.
    location /secure/ {
        secure_link         $arg_md5,$arg_expires;
        secure_link_md5     "$secure_link_expires$uri CHANGE_THIS_SECRET";

        if ($secure_link = "")  { return 403; }   # hash didn't match
        if ($secure_link = "0") { return 410; }   # link expired

        root /var/www/private;
    }

    # =======================================================================
    # Internal redirect - let your app do the auth, Nginx do the sending
    # =======================================================================
    # The app checks permissions, then replies with:
    #   X-Accel-Redirect: /protected-files/movie.mp4
    # Nginx serves the file at full speed and the app's worker is freed
    # immediately. This is the right way to gate large downloads.
    location /protected-files/ {
        internal;                       # unreachable from outside
        alias /var/www/private/;
    }

    location /download/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # =======================================================================
    # Images
    # =======================================================================
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;

        # Serve foo.webp when the browser supports it, else the original.
        location ~* ^/images/(.+)\.(jpe?g|png)$ {
            try_files /images/$1.webp /images/$1.$2 =404;
        }
    }

    access_log /var/log/nginx/media.access.log;
    error_log  /var/log/nginx/media.error.log warn;
}
