# ---------------------------------------------------------------------------
# 03 - Hosting a Static Website
# ---------------------------------------------------------------------------
# Serves the demo site in ./website-files/ with sane caching, gzip and a
# custom 404 page.
#
# Try it locally with Docker (no install, no sudo):
#   docker run --rm -p 8080:80 \
#     -v "$PWD/website-files":/var/www/example.com:ro \
#     -v "$PWD/nginx-static.conf":/etc/nginx/conf.d/default.conf:ro \
#     nginx:alpine
#   open http://localhost:8080
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name localhost example.com www.example.com;

    root  /var/www/example.com;
    index index.html;

    # Compress text responses on the way out. Big win for HTML/CSS/JS.
    gzip on;
    gzip_min_length 1024;                  # don't bother with tiny files
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;

    # ---- Main handler -----------------------------------------------------
    location / {
        # $uri        -> exact file    (/about.html)
        # $uri/       -> directory     (/blog/ -> /blog/index.html)
        # =404        -> give up, serve the 404 page below
        try_files $uri $uri/ =404;
    }

    # ---- Long-lived caching for fingerprinted assets ----------------------
    # Files like app.9f2b1c.css never change, so let browsers keep them.
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;                     # keep the log readable
    }

    # ---- Never cache the HTML itself --------------------------------------
    # Otherwise a deploy can leave visitors on a stale page for days.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # ---- Custom error page ------------------------------------------------
    error_page 404 /404.html;
    location = /404.html {
        internal;                           # only reachable via error_page
    }

    # ---- Small hardening touches ------------------------------------------
    server_tokens off;                      # don't advertise the version
    location ~ /\.(?!well-known) {          # block .git, .env, .htaccess ...
        deny all;
    }

    access_log /var/log/nginx/static.access.log;
    error_log  /var/log/nginx/static.error.log warn;
}
