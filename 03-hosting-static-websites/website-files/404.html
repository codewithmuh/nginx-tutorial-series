<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Not Found</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <div class="badge badge--error">404 Not Found</div>
    <h1>That page isn't on disk.</h1>
    <p>
      Nginx looked for the file, then the directory, then fell through to
      <code>=404</code> — and <code>error_page 404 /404.html;</code> sent you here.
    </p>
    <p><a href="/">&larr; Back home</a></p>
  </main>
</body>
</html>
