# ---------------------------------------------------------------------------
# 01 - Introduction: your very first Nginx server block
# ---------------------------------------------------------------------------
# This is the smallest useful Nginx configuration. Drop it in as a site file
# and Nginx will serve static files from a folder on disk.
#
# Where this file goes:
#   Ubuntu/Debian : /etc/nginx/sites-available/example.conf
#                   then: sudo ln -s /etc/nginx/sites-available/example.conf \
#                                    /etc/nginx/sites-enabled/
#   CentOS/RHEL   : /etc/nginx/conf.d/example.conf
#   macOS (brew)  : /opt/homebrew/etc/nginx/servers/example.conf
#
# Apply it with:
#   sudo nginx -t          # 1. check the syntax BEFORE reloading
#   sudo nginx -s reload   # 2. reload with zero downtime
# ---------------------------------------------------------------------------

server {
    # Port this virtual host answers on. 80 = plain HTTP.
    listen 80;
    listen [::]:80;                     # same, over IPv6

    # Which Host: header this block answers for.
    # "localhost" while you are testing, your domain in production.
    server_name localhost;

    # Folder on disk that maps to "/" in the URL.
    root /var/www/html;

    # File to serve when the URL points at a directory.
    index index.html index.htm;

    # Requests are matched against location blocks, longest prefix wins.
    location / {
        # Try the exact file, then the directory, then return 404.
        try_files $uri $uri/ =404;
    }

    # Where this vhost writes its logs. Tail these while you experiment:
    #   sudo tail -f /var/log/nginx/access.log
    access_log /var/log/nginx/example.access.log;
    error_log  /var/log/nginx/example.error.log warn;
}
