# ---------------------------------------------------------------------------
# 12 - Best Practices: a production-ready starting point
# ---------------------------------------------------------------------------
# The layout below is what a maintainable Nginx setup looks like on a real
# server. Shared settings live in small snippet files that every site
# includes, so a security fix is one edit instead of twenty.
#
#   /etc/nginx/
#     nginx.conf                  <- global settings, includes the rest
#     snippets/
#       ssl-params.conf           <- ciphers, protocols, stapling
#       security-headers.conf     <- the add_header block
#       proxy-params.conf         <- the proxy_set_header block
#     sites-available/
#       example.com.conf          <- one file per site
#     sites-enabled/
#       example.com.conf -> ../sites-available/example.com.conf
# ---------------------------------------------------------------------------


# ===========================================================================
# snippets/proxy-params.conf
# ===========================================================================
# Every proxying location needs these. Write them once:
#
#   proxy_http_version 1.1;
#   proxy_set_header Host              $host;
#   proxy_set_header X-Real-IP         $remote_addr;
#   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_set_header Connection        "";
#   proxy_connect_timeout 5s;
#   proxy_read_timeout   60s;
#
# Then in a site: include snippets/proxy-params.conf;


# ===========================================================================
# snippets/security-headers.conf
# ===========================================================================
#   add_header X-Content-Type-Options    "nosniff" always;
#   add_header X-Frame-Options           "SAMEORIGIN" always;
#   add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
#   add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
#
# Remember: add_header does NOT merge. A location with its own add_header
# drops every inherited one - re-include this snippet there.


# ===========================================================================
# snippets/ssl-params.conf
# ===========================================================================
#   ssl_protocols TLSv1.2 TLSv1.3;
#   ssl_prefer_server_ciphers off;
#   ssl_session_cache shared:SSL:10m;
#   ssl_session_timeout 1d;
#   ssl_session_tickets off;
#   ssl_stapling on;
#   ssl_stapling_verify on;


# ===========================================================================
# sites-available/example.com.conf - a complete, production-shaped site
# ===========================================================================

upstream example_app {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Catch-all: anything that doesn't match a real site gets nothing.
# Put this FIRST so bots scanning by IP never reach a real vhost.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://example.com$request_uri;
    }
}

# www -> apex, over HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    return 301 https://example.com$request_uri;
}

# The site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # include snippets/security-headers.conf;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    server_tokens off;
    client_max_body_size 10m;

    root  /var/www/example.com/public;
    index index.html;

    # Static assets, served by Nginx and cached hard.
    location ~* \.(css|js|woff2|jpg|jpeg|png|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never public.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # The app.
    location / {
        try_files $uri $uri/ @app;
    }

    location @app {
        proxy_pass http://example_app;
        # include snippets/proxy-params.conf;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    access_log /var/log/nginx/example.com.access.log;
    error_log  /var/log/nginx/example.com.error.log warn;
}
