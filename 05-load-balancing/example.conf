# ---------------------------------------------------------------------------
# 05 - Load Balancing
# ---------------------------------------------------------------------------
# One upstream, several backends. Nginx spreads requests across them and
# takes dead ones out of rotation automatically.
# ---------------------------------------------------------------------------

# Log which upstream served each request and how long it took. log_format
# lives in the http context, so it sits here rather than inside the server.
log_format upstreamlog '$remote_addr -> $upstream_addr '
                       '"$request" $status '
                       'request_time=$request_time '
                       'upstream_time=$upstream_response_time';

# --- Round robin (the default) ---------------------------------------------
# Request 1 -> backend1, request 2 -> backend2, request 3 -> backend3, repeat.
upstream backend_rr {
    server 127.0.0.1:3001;
    server 127.0.0.1:3002;
    server 127.0.0.1:3003;

    keepalive 32;
}

# --- Weighted round robin --------------------------------------------------
# Give the bigger box more traffic. Below, backend1 gets 3 of every 5 requests.
upstream backend_weighted {
    server 127.0.0.1:3001 weight=3;   # 8 vCPU machine
    server 127.0.0.1:3002 weight=1;   # 2 vCPU machine
    server 127.0.0.1:3003 weight=1;
}

# --- Least connections -----------------------------------------------------
# Send each request to whichever backend is currently least busy. Better than
# round robin when request durations vary a lot.
upstream backend_leastconn {
    least_conn;
    server 127.0.0.1:3001;
    server 127.0.0.1:3002;
}

# --- IP hash (sticky sessions) ---------------------------------------------
# The same client IP always lands on the same backend. Use this only if your
# app keeps session state in local memory - shared sessions (Redis) are better.
upstream backend_sticky {
    ip_hash;
    server 127.0.0.1:3001;
    server 127.0.0.1:3002;
}

# --- Passive health checks + backup ----------------------------------------
upstream backend_ha {
    server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=30s;

    # Only receives traffic when every server above is down.
    server 127.0.0.1:3009 backup;

    # Taken out of rotation by hand - drain it before a deploy, no reload
    # of the whole config needed if you use the "down" flag.
    server 127.0.0.1:3003 down;
}

server {
    listen 80;
    server_name lb.example.com;

    location / {
        proxy_pass http://backend_ha;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # If a backend errors or times out, silently retry the next one.
        # Cap the retries so a bad request can't stampede the whole pool.
        proxy_next_upstream        error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries  2;
        proxy_next_upstream_timeout 10s;

        proxy_connect_timeout 3s;
        proxy_read_timeout   30s;

        # Handy while testing: shows which backend answered.
        add_header X-Upstream $upstream_addr always;
    }

    # Long-running admin endpoints go to the least-busy node.
    location /reports/ {
        proxy_pass http://backend_leastconn;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    access_log /var/log/nginx/lb.access.log upstreamlog;
}
