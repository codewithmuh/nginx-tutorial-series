# ---------------------------------------------------------------------------
# 13 - Real-World Nginx Projects
# ---------------------------------------------------------------------------
# Five complete setups you can lift into a real server. Each is a pattern you
# will meet again and again:
#
#   1. React/Vue SPA + API on one domain
#   2. WordPress / PHP-FPM
#   3. API gateway in front of microservices
#   4. Maintenance mode with an allow-list
#   5. Blue-green deployment switch
# ---------------------------------------------------------------------------

# Rate-limit zones used by projects 2 and 3. In a real setup these live once
# in your http context (see chapter 08); they are repeated here so this file
# validates on its own.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m   rate=10r/s;
limit_req_status 429;

# ===========================================================================
# PROJECT 1 - Single-page app with an API on the same domain
# ===========================================================================
# The classic modern deployment: static build from `npm run build`, plus an
# API on /api/. Same origin, so no CORS at all.

upstream spa_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name app.example.com;

    root  /var/www/app/dist;      # output of `npm run build`
    index index.html;

    # Vite/webpack fingerprint these, so cache them forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The API. Same origin => no preflight, no CORS headers needed.
    location /api/ {
        proxy_pass http://spa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html must never be cached, or users run stale JS after a deploy.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Everything else falls through to the client-side router.
    # Without this, refreshing on /dashboard returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ===========================================================================
# PROJECT 2 - WordPress (or any PHP app) with PHP-FPM
# ===========================================================================

server {
    listen 80;
    server_name blog.example.com;

    root  /var/www/wordpress;
    index index.php index.html;

    client_max_body_size 64m;      # media uploads

    # WordPress permalinks: hand unknown paths to index.php
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        # SECURITY: without this, an uploaded "image.jpg/x.php" can execute.
        try_files $uri =404;

        include        fastcgi_params;
        fastcgi_pass   unix:/run/php/php8.2-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
    }

    # Lock down the usual WordPress attack surface.
    location = /wp-login.php {
        limit_req zone=login burst=3 nodelay;   # zone defined in chapter 08
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php/php8.2-fpm.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location = /xmlrpc.php { deny all; }        # brute-force amplifier
    location ~* /(?:uploads|files)/.*\.php$ { deny all; }
    location ~ /\. { deny all; }
}

# ===========================================================================
# PROJECT 3 - API gateway in front of microservices
# ===========================================================================
# One public hostname, several services behind it, each with its own limits.

upstream svc_users  { server 127.0.0.1:4001; keepalive 16; }
upstream svc_orders { server 127.0.0.1:4002; keepalive 16; }
upstream svc_search { server 127.0.0.1:4003; keepalive 16; }

server {
    listen 80;
    server_name api.example.com;

    # One place to set the common proxy headers for every service.
    proxy_http_version 1.1;
    proxy_set_header Connection      "";
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID    $request_id;     # trace across services

    location /v1/users/  { proxy_pass http://svc_users/;  }
    location /v1/orders/ { proxy_pass http://svc_orders/; }

    # Search is expensive: cache it and cap the rate.
    location /v1/search/ {
        proxy_pass http://svc_search/;
        proxy_cache_valid 200 5m;
        limit_req zone=api burst=10 nodelay;         # zone from chapter 08
    }

    # CORS for browser clients on a different origin.
    location /v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "https://app.example.com";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
        return 404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# ===========================================================================
# PROJECT 4 - Maintenance mode with an allow-list
# ===========================================================================
# Flip maintenance on by creating a file; no config edit, no reload:
#     sudo touch /var/www/maintenance.on     # on
#     sudo rm    /var/www/maintenance.on     # off

server {
    listen 80;
    server_name shop.example.com;

    root /var/www/shop;

    # Your own IPs skip maintenance so you can verify the deploy.
    set $maintenance 0;
    if (-f /var/www/maintenance.on) { set $maintenance 1; }
    if ($remote_addr = 203.0.113.42) { set $maintenance 0; }

    if ($maintenance = 1) {
        return 503;
    }

    # 503 is the correct status: it tells search engines "come back later"
    # instead of de-indexing the site.
    error_page 503 @maintenance;
    location @maintenance {
        root /var/www/maintenance;
        rewrite ^ /index.html break;
        add_header Retry-After 3600 always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# ===========================================================================
# PROJECT 5 - Blue-green deployment
# ===========================================================================
# Two identical environments. Switch traffic by editing one included file
# and reloading - rollback is the same edit in reverse, in seconds.
#
#   /etc/nginx/conf.d/active-color.conf contains exactly one line:
#       set $active_backend "blue";        (or "green")

upstream blue  { server 127.0.0.1:5001; keepalive 16; }
upstream green { server 127.0.0.1:5002; keepalive 16; }

server {
    listen 80;
    server_name www.example.com;

    # include conf.d/active-color.conf;
    set $active_backend "blue";

    location / {
        proxy_pass http://$active_backend;     # variable => resolved per request

        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reach the idle environment directly to smoke-test before switching.
    location /_blue/  { proxy_pass http://blue/;  proxy_set_header Host $host; }
    location /_green/ { proxy_pass http://green/; proxy_set_header Host $host; }
}
