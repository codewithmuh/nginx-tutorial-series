# ---------------------------------------------------------------------------
# 06 - SSL/TLS with Nginx
# ---------------------------------------------------------------------------
# A production-shaped HTTPS setup: HTTP redirects to HTTPS, modern ciphers
# only, HSTS, OCSP stapling, and a carve-out so Certbot can renew.
#
# Certificate paths below assume Let's Encrypt via Certbot:
#   sudo certbot certonly --nginx -d example.com -d www.example.com
# ---------------------------------------------------------------------------

# --- Port 80: redirect everything to HTTPS ---------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Exception: leave the ACME challenge path on plain HTTP so certificate
    # renewal keeps working. Without this, renewals fail after 90 days and
    # your site goes dark.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;   # 301 = permanent
    }
}

# --- Port 443: the real site -----------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx >= 1.25.1 (older: "listen 443 ssl http2;")
    server_name example.com www.example.com;

    # --- Certificate and key ----------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # --- Protocol and ciphers ---------------------------------------------
    # TLS 1.2 and 1.3 only. 1.0/1.1 are deprecated and fail PCI scans.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # let modern clients pick; they choose well
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # --- Session resumption (big latency win for repeat visitors) ----------
    ssl_session_cache   shared:SSL:10m;   # ~40,000 sessions per 10m
    ssl_session_timeout 1d;
    ssl_session_tickets off;              # off = better forward secrecy

    # --- OCSP stapling ----------------------------------------------------
    # Nginx fetches the revocation proof itself, so the browser doesn't have
    # to make an extra round trip to the CA.
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/example.com/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --- HSTS -------------------------------------------------------------
    # Tells browsers "only ever talk to me over HTTPS" for the next 2 years.
    # WARNING: you cannot take this back before it expires. Confirm HTTPS
    # works on every subdomain before adding includeSubDomains/preload.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # --- Other security headers -------------------------------------------
    add_header X-Content-Type-Options "nosniff"            always;
    add_header X-Frame-Options        "SAMEORIGIN"         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # --- The site itself --------------------------------------------------
    root  /var/www/example.com;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    server_tokens off;
    access_log /var/log/nginx/ssl.access.log;
    error_log  /var/log/nginx/ssl.error.log warn;
}

# ---------------------------------------------------------------------------
# Local testing without a real domain
# ---------------------------------------------------------------------------
# Generate a self-signed cert:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout /etc/nginx/certs/local.key \
#     -out    /etc/nginx/certs/local.crt \
#     -subj "/CN=localhost"
#
# Then swap the two ssl_certificate lines above for those paths and comment
# out the stapling block (self-signed certs have no OCSP responder).
# Your browser will warn about the certificate - that is expected.
# ---------------------------------------------------------------------------
