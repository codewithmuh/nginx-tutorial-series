# ---------------------------------------------------------------------------
# 07 - URL Rewriting and Redirects
# ---------------------------------------------------------------------------
# Two different things that look similar:
#
#   REDIRECT - Nginx replies "go here instead". The browser's URL changes.
#              -> return 301 / return 302
#   REWRITE  - Nginx quietly serves a different path. The URL stays put.
#              -> rewrite ... last;  /  try_files
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name www.example.com;

    # --- Canonical host: www -> non-www ------------------------------------
    # One canonical hostname keeps your SEO and your cookies sane.
    return 301 $scheme://example.com$request_uri;
}

server {
    listen 80;
    server_name example.com;

    root  /var/www/example.com;
    index index.html;

    # =======================================================================
    # REDIRECTS - the browser sees a new URL
    # =======================================================================

    # Single page moved permanently.
    location = /old-page.html {
        return 301 /new-page.html;
    }

    # A whole section moved. $1 captures whatever followed /blog/.
    location ^~ /blog/ {
        rewrite ^/blog/(.*)$ /articles/$1 permanent;   # permanent = 301
    }

    # Temporary redirect - use 302 for maintenance/AB tests so browsers
    # and search engines don't cache it forever.
    location = /sale {
        return 302 /promotions/summer;
    }

    # Redirect with a query string preserved.
    location = /search {
        return 301 /find?$query_string;
    }

    # =======================================================================
    # REWRITES - the URL in the address bar does not change
    # =======================================================================

    # Pretty URLs: /products/42 is served by /product.php?id=42
    location /products/ {
        rewrite ^/products/([0-9]+)/?$ /product.php?id=$1 last;
    }

    # Strip a version prefix before it reaches the app: /v1/users -> /users
    location /v1/ {
        rewrite ^/v1/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # =======================================================================
    # try_files - the cheaper, clearer alternative to most rewrites
    # =======================================================================

    # Single-page app (React/Vue/Angular): serve the file if it exists,
    # otherwise hand index.html to the client-side router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Extensionless URLs: /about serves /about.html
    location /pages/ {
        try_files $uri $uri.html $uri/ =404;
    }

    # Serve a WebP version when the browser supports it, fall back if not.
    # ($webp_suffix is set by the map at the bottom of this file.)
    location ~* ^/img/(.+)\.(jpe?g|png)$ {
        root /var/www/example.com;
        try_files /img/$1$webp_suffix /img/$1.$2 =404;
    }

    # =======================================================================
    # root vs alias - the classic trap
    # =======================================================================
    #   root  /var/www/files;    +  request /downloads/a.zip
    #     -> /var/www/files/downloads/a.zip   (URI is APPENDED)
    #   alias /var/www/files/;   +  request /downloads/a.zip
    #     -> /var/www/files/a.zip             (prefix is REPLACED)
    location /downloads/ {
        alias /var/www/files/;    # trailing slash on both: do not omit it
        autoindex on;             # directory listing, handy for file dumps
    }

    # =======================================================================
    # Conditional redirects with map (preferred over "if")
    # =======================================================================
    # See the map blocks below - $redirect_uri is empty for most requests.
    if ($redirect_uri) {
        return 301 $redirect_uri;
    }

    # Block bad user agents with a redirect-free 403.
    if ($http_user_agent ~* (badbot|scraper)) {
        return 403;
    }
}

# --- map blocks live in the http context -----------------------------------

# A lookup table of one-off legacy URLs. Far faster and safer than a stack of
# "if" statements, and it stays readable at 500 entries.
map $request_uri $redirect_uri {
    default                 "";
    /2019/old-launch-post   /blog/launch;
    /team.html              /about/team;
    /jobs                   https://careers.example.com;
}

# Set $webp_suffix to ".webp" only when the browser advertises support.
map $http_accept $webp_suffix {
    default     "";
    "~*webp"    ".webp";
}
